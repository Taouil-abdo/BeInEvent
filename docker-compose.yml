services:
  backend:
    build: ./backend
    container_name: beinevent-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - beinevent-network

  frontend:
    build: ./frontend
    container_name: beinevent-frontend
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - beinevent-network

  mongodb:
    image: mongo:7.0
    container_name: beinevent-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=beinevent
    volumes:
      - mongodb_data:/data/db
    networks:
      - beinevent-network

volumes:
  mongodb_data:

networks:
  beinevent-network:
    driver: bridge
